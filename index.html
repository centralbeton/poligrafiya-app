<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poligrafiya Katalogi</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #17212b;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .product-card {
            background-color: #242f3d;
            border: 2px solid transparent;
            border-radius: 10px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .product-card.selected {
            border-color: #64b5f6;
            background-color: #2b5278;
        }

        .product-card img {
            width: 100%;
            height: 90px;
            object-fit: cover;
            border-radius: 6px;
        }

        .product-title {
            font-size: 13px;
            font-weight: bold;
            margin: 6px 0 2px 0;
        }

        .product-price {
            font-size: 11px;
            color: #64b5f6;
            margin-bottom: 6px;
        }

        .select-btn {
            background-color: #2b5278;
            color: #fff;
            border: none;
            padding: 6px;
            border-radius: 6px;
            width: 100%;
            font-size: 12px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 11px;
            color: #aaaaaa;
            margin-bottom: 4px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            background-color: #242f3d;
            border: 1px solid #384758;
            border-radius: 8px;
            color: #ffffff;
            font-size: 13px;
            box-sizing: border-box;
        }

        textarea {
            height: 70px;
            resize: none;
        }

        .send-btn {
            background-color: #5288c1;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .send-btn:active {
            background-color: #43709e;
        }
    </style>
</head>
<body>

    <h2>🎨 Poligrafiya Katalogi</h2>

    <div class="products-grid">
        <div class="product-card" onclick="selectProduct('Premium Taklifnoma', 12000, this)">
            <img src="https://picsum.photos/200/150?random=1" alt="Premium">
            <div class="product-title">Premium Taklifnoma</div>
            <div class="product-price">12 000 UZS</div>
            <button class="select-btn">Tanlash</button>
        </div>
        <div class="product-card" onclick="selectProduct('Minimalist Style', 8000, this)">
            <img src="https://picsum.photos/200/150?random=2" alt="Minimalist">
            <div class="product-title">Minimalist Style</div>
            <div class="product-price">8 000 UZS</div>
            <button class="select-btn">Tanlash</button>
        </div>
    </div>

    <h3>✏️ Buyurtma tafsilotlari</h3>

    <div class="form-group">
        <label>Tanlangan Mahsulot:</label>
        <input type="text" id="selectedProduct" readonly placeholder="Mahsulotni tanlang">
    </div>

    <div class="form-group">
        <label>Kelin va Kuyov ismlari:</label>
        <input type="text" id="names" placeholder="Masalan: Behzod va Madina">
    </div>

    <div class="form-group">
        <label>Sana va Manzil:</label>
        <textarea id="details" placeholder="Sana, soat va restoran manzilini kiriting"></textarea>
    </div>

    <button class="send-btn" onclick="sendData()">BUYURTMANI YUBORISH</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let selectedProductName = '';
        let selectedProductPrice = 0;

        function selectProduct(name, price, element) {
            selectedProductName = name;
            selectedProductPrice = price;

            document.querySelectorAll('.product-card').forEach(card => card.classList.remove('selected'));
            element.classList.add('selected');

            document.getElementById('selectedProduct').value = `${name} (${price} UZS)`;
        }

        function sendData() {
            let names = document.getElementById('names').value.trim();
            let details = document.getElementById('details').value.trim();

            if (!selectedProductName) {
                alert('Iltimos, avval mahsulotni tanlang!');
                return;
            }

            if (!names) {
                alert('Iltimos, ismlarni kiriting!');
                return;
            }

            let data = {
                product: selectedProductName,
                price: selectedProductPrice,
                names: names,
                details: details
            };

            // Telegram botga ma'lumot yuborish
            try {
                tg.sendData(JSON.stringify(data));
                tg.close();
            } catch (e) {
                alert('Xatolik: ' + e.message);
            }
        }
    </script>
</body>
</html>
